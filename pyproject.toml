[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vascumamba-spot"
version = "0.1.0"
description = "VascuMamba-Spot: Autonomic-Gated Neuro-Vascular and Kinematic Selective State-Space Modeling for Untrimmed Micro-Expression Spotting and Recognition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  {name = "VascuMamba-Spot Authors"}
]
dependencies = [
  "numpy>=1.24,<2.0",
  "torch>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "einops>=0.7",
  "pyyaml>=6.0",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "opencv-python-headless>=4.8",
  "mediapipe>=0.10",
]

[project.optional-dependencies]
cuda = [
  "mamba-ssm>=2.0",
  "causal-conv1d>=1.2",
  "timm>=0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
